# Example nginx site for BiziSmart. Review before use; TLS certificates and
# real hostnames are provisioned outside the repository.
# - Serves backend/public via PHP-FPM for api.bizismart.co.tz and the
#   Filament panel at admin.bizismart.co.tz (ADMIN_DOMAIN).
# - Serves the built frontend (frontend/dist) for shop subdomains.
upstream bizismart_php {
    server unix:/run/php/php8.3-fpm-bizismart.sock;
}
server {
    listen 80;
    server_name api.bizismart.co.tz admin.bizismart.co.tz *.bizismart.co.tz;
    # After certificate issuance, redirect to HTTPS and serve only 443 below.
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name api.bizismart.co.tz admin.bizismart.co.tz;
    ssl_certificate /etc/letsencrypt/live/bizismart.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bizismart.co.tz/privkey.pem;
    root /srv/bizismart/backend/public;
    index index.php;
    client_max_body_size 8m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        fastcgi_pass bizismart_php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name ~^(?<shop>.+)\.bizismart\.co\.tz$;
    ssl_certificate /etc/letsencrypt/live/bizismart.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bizismart.co.tz/privkey.pem;
    root /srv/bizismart/frontend/dist;
    index index.html;
    client_max_body_size 8m;
    # Preserve the tenant Host: Laravel resolves the shop from this hostname.
    # The React client deliberately calls its own origin's /api/v1 endpoints.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/bizismart/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_HOST $host;
        fastcgi_pass bizismart_php;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
