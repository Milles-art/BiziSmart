; Example supervisord programs for BiziSmart. Review paths/user before use.
; The Laravel minute scheduler drives reconcile/dispatch/cleanup/alert commands;
; it needs exactly one of: system cron invoking `php artisan schedule:run`, or
; the schedule:work program below (not both).

[program:bizismart-schedule]
command=php /srv/bizismart/backend/artisan schedule:work
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/bizismart/schedule.log
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
directory=/srv/bizismart/backend

[program:bizismart-queue]
command=php /srv/bizismart/backend/artisan queue:work --sleep=3 --tries=3 --timeout=60 --max-time=3600
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/bizismart/queue.log
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
directory=/srv/bizismart/backend
numprocs=1
